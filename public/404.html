<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FlowForge</title>
  <script>
    // GitHub Pages doesn't support SPA routing natively.
    // This script redirects 404s back to index.html with a query param.
    const path = window.location.pathname;
    const base = '/flowforge'; // Must match your repo name!
    window.location.replace(base + '/?redirect=' + encodeURIComponent(path));
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
